
<!DOCTYPE html>
<html>
<head>
    <title>Student Attendance System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="sidebar">
    <h2>🎓 Attendance</h2>
    <p>Dashboard</p>
    <p>Students</p>
    <p>Attendance</p>
</div>

<div class="main">

    <h1>Student Attendance Dashboard</h1>
    <p>Welcome to Attendance Management System</p>

    <div class="cards">
        <div class="card">
            <h3>Total Students</h3>
            <h2 id="total">3</h2>
        </div>

        <div class="card">
            <h3>Present</h3>
            <h2 id="present">0</h2>
        </div>

        <div class="card">
            <h3>Absent</h3>
            <h2 id="absent">0</h2>
        </div>
    </div>

    <div class="section">
        <h2>Add Student</h2>
        <input type="text" id="studentName"
               placeholder="Enter student name">
        <button onclick="addStudent()">Add Student</button>
    </div>

    <div class="section">
        <h2>Mark Attendance</h2>

        <select id="student">
            <option value="Rahul">Rahul</option>
            <option value="Priya">Priya</option>
            <option value="Amit">Amit</option>
        </select>

        <select id="status">
            <option value="Present">Present</option>
            <option value="Absent">Absent</option>
        </select>

        <button onclick="markAttendance()">Submit</button>
    </div>

    <div class="section">
        <h2>Attendance Records</h2>

        <table>
            <thead>
                <tr>
                    <th>Student Name</th>
                    <th>Status</th>
                </tr>
            </thead>

            <tbody id="records"></tbody>
        </table>
    </div>

</div>

<script src="script.js"></script>
</body>
</html>
